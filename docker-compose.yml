services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopping_db
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    container_name: minio-container
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - minio-data:/data
    networks:
      - app-network

  backend:
    image: "amirzr98/onlineshop:v1"
    container_name: backend-container
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - minio
    restart: unless-stopped
    networks:
      - app-network
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#      SPRING_DATASOURCE_USERNAME: root
#      SPRING_DATASOURCE_PASSWORD: root
#      MINIO_ENDPOINT: http://minio:9000
#      MINIO_ACCESS_KEY: minioadmin
#      MINIO_SECRET_KEY: minioadmin
#    volumes:
#      - maven-repo:/root/.m2
#      - ./target:/app/target

volumes:
#  maven-repo:
  mysql-data:
  minio-data:

networks:
  app-network:
    driver: bridge
